name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go test ./...

  linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: make build-linux-amd64
      - run: cp dist/cpa-account-usage_linux_amd64.so dist/cpa-account-usage-${GITHUB_REF_NAME}.so
        if: startsWith(github.ref, 'refs/tags/')
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-account-usage_linux_amd64
          path: dist/*.so
      - run: gh release create "${GITHUB_REF_NAME}" dist/cpa-account-usage_linux_amd64.so dist/cpa-account-usage-${GITHUB_REF_NAME}.so --title "${GITHUB_REF_NAME}" --generate-notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
